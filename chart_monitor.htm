<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>AI 자동매매 데이터 모니터링 대시보드</title>
    <!-- TradingView Lightweight Charts 라이브러리 로드 -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #131722; color: #d1d4dc; margin: 0; padding: 20px; }
        .header { display: flex; align-items: center; margin-bottom: 20px; }
        input, button { padding: 8px 12px; margin-right: 10px; background: #2a2e39; border: 1px solid #434651; color: #fff; border-radius: 4px; }
        button { cursor: pointer; background: #2962ff; border: none; font-weight: bold; }
        button:hover { background: #1e53e5; }
        #tvchart { width: 100%; height: 600px; border: 1px solid #2a2e39; }
    </style>
</head>
<body>
    <div class="header">
        <h2>수집 데이터 검증기</h2>
        <div style="margin-left: auto;">
            <input type="text" id="stk_cd" value="005930" placeholder="종목코드 (예: 005930)">
            <button onclick="loadChartData()">데이터 불러오기</button>
        </div>
    </div>
    <div id="tvchart"></div>

    <script>
        const chartOptions = { 
            layout: { textColor: '#d1d4dc', backgroundColor: '#131722' },
            grid: { vertLines: { color: '#2a2e39' }, horzLines: { color: '#2a2e39' } },
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        };
        const chart = LightweightCharts.createChart(document.getElementById('tvchart'), chartOptions);
        const candleSeries = chart.addCandlestickSeries({ upColor: '#26a69a', downColor: '#ef5350', borderVisible: false, wickUpColor: '#26a69a', wickDownColor: '#ef5350' });

        async function loadChartData() {
            const stkCd = document.getElementById('stk_cd').value;
            try {
                // FastAPI 백엔드 호출
                const response = await fetch(`http://localhost:8000/api/v1/data/chart/${stkCd}`);
                const result = await response.json();
                
                if (result.data) {
                    candleSeries.setData(result.data);
                    chart.timeScale().fitContent();
                    console.log(`[${stkCd}] 데이터 로딩 성공`);
                }
            } catch (error) {
                alert("데이터를 불러오지 못했습니다. 백엔드 서버(run_api_server.py)가 실행 중인지 확인하세요.");
                console.error(error);
            }
        }
        
        // 페이지 로드 시 기본 종목(삼성전자) 렌더링
        loadChartData();
    </script>
</body>
</html>
